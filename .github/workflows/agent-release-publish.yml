name: Agent Release — Build & Publish Windows .exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.0)"
        required: true
        type: string
      upload_to_server:
        description: "Auto-upload .exe to the UFO server after build"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-windows-exe:
    name: Build on windows-latest
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      AGENT_RELEASE_UPLOAD_URL: ${{ secrets.AGENT_RELEASE_UPLOAD_URL }}
      AGENT_RELEASE_API_KEY: ${{ secrets.AGENT_RELEASE_API_KEY }}
      AGENT_RELEASE_TENANT_SLUG: ${{ secrets.AGENT_RELEASE_TENANT_SLUG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Resolve the best available GitHub token ─────────────────────────────
      # GITHUB_PERSONAL_ACCESS_TOKEN (admin PAT) can bypass repo rulesets that
      # block tag creation.  Falls back to the default GITHUB_TOKEN if not set.
      - name: Resolve GitHub token
        shell: pwsh
        run: |
          $pat = "${{ secrets.GITHUB_PERSONAL_ACCESS_TOKEN }}"
          if (-not [string]::IsNullOrWhiteSpace($pat)) {
            Write-Host "Using GITHUB_PERSONAL_ACCESS_TOKEN (admin PAT)"
            echo "GH_TOKEN=$pat" >> $env:GITHUB_ENV
          } else {
            Write-Host "Using default GITHUB_TOKEN"
            echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $env:GITHUB_ENV
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path "agent/requirements.txt") {
            pip install -r agent/requirements.txt
          } elseif (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }

      - name: Stamp version into agent/version.py
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([._-][A-Za-z0-9._-]*)?$') {
            throw "Invalid version string '$version' — must be semver e.g. 1.2.3"
          }
          Set-Content -Path agent/version.py -Value "AGENT_VERSION = `"$version`"" -Encoding utf8
          Write-Host "Stamped version: $version"

      # ── Get NSSM (Windows service wrapper) ───────────────────────────────────
      # nssm.cc is unreliable — install via Chocolatey (pre-installed on every
      # GitHub Actions Windows runner) then copy the binary into agent/dist/
      # so the NSIS installer can bundle it.
      - name: Install NSSM via Chocolatey
        shell: pwsh
        run: |
          Write-Host "Installing NSSM via Chocolatey..."
          choco install nssm --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "choco install nssm failed (exit $LASTEXITCODE)" }

          # Locate the installed binary (Chocolatey puts it in the shims dir or tools)
          $nssmExe = (Get-Command nssm -ErrorAction SilentlyContinue).Source
          if (-not $nssmExe) {
            # Fallback: common Chocolatey install path
            $nssmExe = "C:\ProgramData\chocolatey\lib\nssm\tools\nssm.exe"
          }
          if (-not (Test-Path $nssmExe)) {
            throw "Could not locate nssm.exe after Chocolatey install"
          }

          New-Item -ItemType Directory -Force -Path "agent\dist" | Out-Null
          Copy-Item $nssmExe "agent\dist\nssm.exe" -Force
          Write-Host "NSSM ready at agent\dist\nssm.exe ($([math]::Round((Get-Item 'agent\dist\nssm.exe').Length / 1KB, 1)) KB)"

      - name: Build Windows .exe with PyInstaller
        shell: pwsh
        working-directory: agent
        run: |
          pyinstaller build.spec --clean --noconfirm
          $exe = "dist\aaditech-agent.exe"
          if (-not (Test-Path $exe)) { throw "Build failed — $exe not found" }

          $versioned = "dist\aaditech-agent-${{ github.event.inputs.version }}.exe"
          Copy-Item $exe $versioned -Force
          Write-Host "Built: $versioned ($([math]::Round((Get-Item $versioned).Length / 1MB, 2)) MB)"

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $exe  = "agent\dist\aaditech-agent-${{ github.event.inputs.version }}.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"
          echo "EXE_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Upload .exe as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaditech-agent-${{ github.event.inputs.version }}-windows
          path: agent/dist/aaditech-agent-${{ github.event.inputs.version }}.exe
          retention-days: 90

      # ── Publish GitHub Release ───────────────────────────────────────────────
      # Uses the GitHub REST API directly (not gh CLI) with the admin PAT.
      # The PAT has repo admin scope which bypasses tag-protection rulesets.
      #
      # Full sequence every run:
      #   1. Delete existing release for this tag (if any)
      #   2. Delete existing git tag (if any) — clears the "immutable" association
      #   3. Create a fresh git tag pointing at HEAD
      #   4. Create the GitHub Release
      #   5. Upload the .exe as a release asset
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $tag     = "v$version"
          $repo    = "${{ github.repository }}"
          $exe     = "agent\dist\aaditech-agent-$version.exe"
          $sha256  = "$env:EXE_SHA256"
          $actor   = "${{ github.actor }}"
          $apiBase = "https://api.github.com/repos/$repo"

          $hdrs = @{
            "Authorization"        = "Bearer $env:GH_TOKEN"
            "Accept"               = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          function Invoke-GH {
            param($Method, $Uri, $Body)
            $params = @{ Method = $Method; Uri = $Uri; Headers = $hdrs; UseBasicParsing = $true }
            if ($Body) { $params.Body = ($Body | ConvertTo-Json -Depth 5); $params.ContentType = "application/json" }
            try { return Invoke-RestMethod @params }
            catch { Write-Host "  [warn] $Method $Uri — $($_.Exception.Message)"; return $null }
          }

          # ── 1. Delete existing release ──────────────────────────────────────
          Write-Host "==> Checking for existing release $tag ..."
          $releases = Invoke-GH GET "$apiBase/releases"
          $existing = $releases | Where-Object { $_.tag_name -eq $tag }
          if ($existing) {
            Write-Host "    Deleting release id=$($existing.id) ..."
            Invoke-GH DELETE "$apiBase/releases/$($existing.id)"
            Start-Sleep -Seconds 2
          } else {
            Write-Host "    No existing release — skipping."
          }

          # ── 2. Delete existing git tag (clears GitHub's immutable-tag record) ──
          Write-Host "==> Checking for existing tag $tag ..."
          $tagRef = Invoke-GH GET "$apiBase/git/refs/tags/$tag"
          if ($tagRef) {
            Write-Host "    Deleting git tag $tag ..."
            Invoke-GH DELETE "$apiBase/git/refs/tags/$tag"
            Start-Sleep -Seconds 2
          } else {
            Write-Host "    Tag does not exist — skipping."
          }

          # ── 3. Resolve HEAD commit SHA ──────────────────────────────────────
          Write-Host "==> Resolving HEAD commit ..."
          # Try main, then master
          $ref = Invoke-GH GET "$apiBase/git/refs/heads/main"
          if (-not $ref) { $ref = Invoke-GH GET "$apiBase/git/refs/heads/master" }
          if (-not $ref) { throw "Could not resolve HEAD — neither main nor master branch found" }
          $headSha = $ref.object.sha
          Write-Host "    HEAD = $headSha"

          # ── 4. Create fresh git tag ─────────────────────────────────────────
          Write-Host "==> Creating git tag $tag at $headSha ..."
          $newRef = Invoke-GH POST "$apiBase/git/refs" @{ ref = "refs/tags/$tag"; sha = $headSha }
          if (-not $newRef) { throw "Failed to create git tag $tag — check PAT permissions and repo rulesets" }
          Write-Host "    Tag created: $($newRef.ref)"
          Start-Sleep -Seconds 1

          # ── 5. Create GitHub Release ────────────────────────────────────────
          Write-Host "==> Creating GitHub Release ..."
          $notes = "## Aaditech UFO Agent v$version`n`n**SHA-256:** ``$sha256```n`nBuilt on ``windows-latest`` by GitHub Actions.`nTriggered by: $actor`n`n### Installation`n1. Download ``aaditech-agent-$version.exe```n2. Run the NSIS installer — registers as an auto-restart Windows service.`n3. Or run the bare .exe directly for testing."
          $release = Invoke-GH POST "$apiBase/releases" @{
            tag_name   = $tag
            name       = "Aaditech Agent v$version"
            body       = $notes
            draft      = $false
            prerelease = $false
          }
          if (-not $release) { throw "Failed to create GitHub Release" }
          Write-Host "    Release id=$($release.id)"

          # ── 6. Upload .exe asset ────────────────────────────────────────────
          Write-Host "==> Uploading asset ..."
          $uploadBase = $release.upload_url -replace '\{[^}]+\}', ''
          $assetName  = [System.IO.Path]::GetFileName($exe)
          $exeBytes   = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $uploadHdrs = @{
            "Authorization"        = "Bearer $env:GH_TOKEN"
            "Accept"               = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "Content-Type"         = "application/octet-stream"
          }
          $upload = Invoke-RestMethod `
            -Uri "${uploadBase}?name=$assetName" `
            -Method POST -Headers $uploadHdrs `
            -Body $exeBytes -UseBasicParsing
          Write-Host "    Asset uploaded: $($upload.browser_download_url)"

          Write-Host ""
          Write-Host "Release published: https://github.com/$repo/releases/tag/$tag"

      - name: Auto-upload to UFO server
        if: ${{ github.event.inputs.upload_to_server == 'true' }}
        shell: pwsh
        continue-on-error: true
        run: |
          $url     = "${{ env.AGENT_RELEASE_UPLOAD_URL }}"
          $apiKey  = "${{ env.AGENT_RELEASE_API_KEY }}"
          $tenant  = if ("${{ env.AGENT_RELEASE_TENANT_SLUG }}" -ne "") { "${{ env.AGENT_RELEASE_TENANT_SLUG }}" } else { "default" }
          $version = "${{ github.event.inputs.version }}"
          $exePath = "agent\dist\aaditech-agent-$version.exe"

          if ([string]::IsNullOrWhiteSpace($url)) {
            Write-Host "AGENT_RELEASE_UPLOAD_URL not set — skipping server upload."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($apiKey)) {
            Write-Host "AGENT_RELEASE_API_KEY not set — skipping server upload."
            exit 0
          }

          Write-Host "Uploading $exePath to $url ..."
          try {
            $response = Invoke-RestMethod `
              -Uri "$url/api/agent/releases/upload" `
              -Method POST `
              -Headers @{ "X-API-Key" = $apiKey; "X-Tenant-Slug" = $tenant } `
              -Form @{ version = $version; file = Get-Item $exePath }
            Write-Host "Server response: $($response | ConvertTo-Json -Depth 3)"
          } catch {
            Write-Warning "Server upload failed: $_"
          }

      - name: Build summary
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $sha256  = "$env:EXE_SHA256"
          $actor   = "${{ github.actor }}"
          Write-Host "::notice::Built aaditech-agent-$version.exe (SHA-256: $sha256) by $actor"
          @"
          ## Agent Release Build Summary

          | Field | Value |
          |---|---|
          | Version | ``$version`` |
          | SHA-256 | ``$sha256`` |
          | Runner OS | windows-latest |
          | Triggered by | $actor |
          | GitHub Release | [v$version](https://github.com/${{ github.repository }}/releases/tag/v$version) |
          | NSSM bundled | Yes (2.24, win64) |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
